<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List | Michael Yugi</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>
<body>

```
<main class="todo-container">
    <h1>My To-Do List</h1>
    <p class="subtitle">Organize your tasks and stay productive.</p>

    <form id="todo-form">
        <input
            type="text"
            id="task-input"
            placeholder="Enter a new task..."
            autocomplete="off"
        >
        <button type="submit" id="add-task">Add Task</button>
    </form>

    <div class="filters">
        <button type="button" class="filter-btn active" data-filter="all">All</button>
        <button type="button" class="filter-btn" data-filter="active">Active</button>
        <button type="button" class="filter-btn" data-filter="completed">Completed</button>
    </div>

    <ul id="task-list"></ul>

    <div class="todo-footer">
        <p id="items-left">0 items left</p>
        <button type="button" id="clear-completed">Clear Completed</button>
    </div>
</main>
```

</body>
</html>
